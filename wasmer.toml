[package]
name = "abapqlcm/aurora-sync"
version = "0.1.0"
description = "AuroraSync - lightweight data sync service (FastAPI)"
readme = "README.md"
repository = "https://github.com/abapqlcm/aurora-sync"

[dependencies]
"wasmer/python" = "^3.13"

[fs]
"/src" = "./src"

[[command]]
name = "aurora-sync"
module = "wasmer/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = [
    "/src/main.py",
]
env = ["PYTHONEXECUTABLE=/bin/python", "PYTHONPATH=/src"]
